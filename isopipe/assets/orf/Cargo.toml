[package]
name = "orf"
edition = "2024"
version = "0.0.3"
authors = ["alejandrogzi <alejandrxgzi@gmail.com>"]
license = "MIT"
description = "Subworkflow for ORF detection"
homepage = "https://github.com/alejandrogzi/isopipe"
repository = "https://github.com/alejandrogzi/isopipe"
readme = "README.md"
keywords = ["iso-seq", "bioinformatics", "genomics", "pipeline"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
log = "0.4.14"
simple_logger = "4.0.0"
time = "0.3.36"
memmap2 = "0.9.5"
dashmap = { version = "6", features = ["rayon"] }
smol_str = "0.2.2"
memchr = "2.7.4"
iso-pack = { path = "../../../isotools/isotools/iso-pack" }
config = { path = "../../../isotools/isotools/config" }
hashbrown = { version = "0.15", features = ["rayon"] }
rayon = "1.10.0"
num_cpus = "1.16.0"
regex = "1.11.1"
flate2 = "1.0.20"
isopipe = { path = "../..", features = ["cfg"], default-features = false }
extract = { path = "../extract", features = ["read"], default-features = false }

[profile.release]
lto = true
opt-level = 3
